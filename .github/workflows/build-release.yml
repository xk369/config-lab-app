name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/config-lab-app

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build immutable image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE_NAME:${{ steps.meta.outputs.image_tag }} \
            -t $IMAGE_NAME:build-${{ github.run_number }} \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.meta.outputs.image_tag }}
          docker push $IMAGE_NAME:build-${{ github.run_number }}

  release-staging:
    name: Release staging configuration
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Describe release
        run: |
          echo "Release ID: staging-${{ needs.build.outputs.image_tag }}"
          echo "Image: ${{ needs.build.outputs.image_ref }}"
          echo "Environment: staging"
          echo "Deployment reuses the fixed image tag and only applies runtime environment variables."

      - name: Migration command
        run: |
          echo "docker run --rm --env-file staging.env ${{ needs.build.outputs.image_ref }} node src/cli.js migrate"

      - name: Deployment command
        run: |
          echo "docker run -d --name config-lab-app-staging --env-file staging.env -e RELEASE_VERSION=${{ needs.build.outputs.image_tag }} ${{ needs.build.outputs.image_ref }}"

  release-production:
    name: Release production configuration
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Describe release
        run: |
          echo "Release ID: production-${{ needs.build.outputs.image_tag }}"
          echo "Image: ${{ needs.build.outputs.image_ref }}"
          echo "Environment: production"
          echo "Production release uses the same image built once in the build job."
