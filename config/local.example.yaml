app:
  name: Config Lab App Local
  env: local-yaml
  releaseVersion: local-yaml

server:
  host: 0.0.0.0
  port: 3001
  shutdownTimeoutMs: 10000
  shutdownDrainMs: 500

storage:
  dataFile: data/tasks.runtime.json

database:
  autoMigrate: true
  client: sqlite
  sqliteFile: data/tasks.sqlite
  postgres:
    host: localhost
    port: 5432
    name: config_lab_app
    user: config_lab_app
    password: replace-with-database-password
    ssl: false

sessions:
  store: memory
  redisUrl: redis://localhost:6379

externalService:
  url: https://api.example.local
  apiToken: replace-with-local-token

logging:
  level: debug
